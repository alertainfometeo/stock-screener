<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación de empresas · Calidad + Finanzas + Valuación</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1c1c1a; --muted:#6b6a65; --line:#e4e2db;
    --good:#1f7a4d; --mid:#b7791f; --bad:#b4372f; --accent:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141413; --card:#1e1e1c; --ink:#f0efe9; --muted:#9c9a92; --line:#33322e;
      --good:#4ade80; --mid:#fbbf24; --bad:#f87171; --accent:#93b4ff; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:880px;margin:0 auto;padding:28px 18px 60px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .brand{font-weight:700;font-size:18px;color:var(--ink)}
  form{display:flex;gap:8px}
  input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:220px;text-transform:uppercase}
  button{font:inherit;padding:9px 16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  h1{margin:0;font-size:28px;line-height:1.2} h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 14px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
  .score{text-align:center}
  .score b{display:block;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
  .score span{font-size:13px;color:var(--muted)}
  .pillars{display:grid;gap:12px;margin-top:20px}
  .pill-row{display:grid;grid-template-columns:150px 1fr 64px;gap:12px;align-items:center;font-size:14px}
  .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  table.m{table-layout:fixed} table.m th:nth-child(1){width:34%} table.m th:nth-child(2){width:20%} table.m th:nth-child(3){width:26%}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .ok{color:var(--good)} .part{color:var(--mid)} .no{color:var(--bad)}
  .tag.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
  .tag.part{background:color-mix(in srgb,var(--mid) 16%,transparent)}
  .tag.no{background:color-mix(in srgb,var(--bad) 14%,transparent)}
  .checks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14px}
  .checks li::before{content:attr(data-mark);display:inline-block;width:20px;font-weight:700}
  tr.struck td{text-decoration:line-through;opacity:.45}
  tr.struck td a{text-decoration:line-through}
  .foot{color:var(--muted);font-size:13px;margin-top:24px}
  .msg{padding:40px 10px;text-align:center;color:var(--muted)}
  @media (max-width:600px){
    .hero{grid-template-columns:1fr} .pill-row{grid-template-columns:110px 1fr 54px}
    .checks{grid-template-columns:1fr} input{width:140px} .hide-sm{display:none}
  }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" id="home" href="./">Evaluación de empresas</a>
    <form id="search" autocomplete="off">
      <input id="q" list="tickers" placeholder="Ticker: NVDA, ADBE…" aria-label="Ticker">
      <datalist id="tickers"></datalist>
      <button>Ver</button>
    </form>
  </header>
  <div id="app"><div class="msg">Cargando datos…</div></div>
  <p class="foot" id="foot"></p>
</main>

<script>
(function(){
  // Base del sitio: "/stock-screener/" en github.io, "/" con dominio propio
  var parts = location.pathname.split("/").filter(Boolean);
  var onGithubIo = /\.github\.io$/.test(location.hostname);
  var baseParts = onGithubIo && parts.length ? [parts[0]] : [];
  var BASE = "/" + baseParts.map(function(p){return p + "/";}).join("");
  var rest = parts.slice(baseParts.length).filter(function(p){ return !/\.html?$/i.test(p); });
  var params = new URLSearchParams(location.search);
  var wanted = (params.get("t") || rest[0] || "").toUpperCase();

  var app = document.getElementById("app");
  document.getElementById("home").href = BASE;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function fmt(v, unit){
    if (v == null) return "—";
    return v.toLocaleString("es-ES", {maximumFractionDigits: 2}) + (unit || "");
  }
  function cls(s){ return s >= 0.999 ? "ok" : (s > 0 ? "part" : "no"); }
  function label(s){ return s >= 0.999 ? "Cumple" : (s > 0 ? "Parcial" : "No cumple"); }
  function color(pct){ return pct >= 0.75 ? "var(--good)" : (pct >= 0.5 ? "var(--mid)" : "var(--bad)"); }
  function bigMoney(v, ccy){
    if (!v) return "—";
    var u = [[1e12,"B"],[1e9,"mM"],[1e6,"M"]];
    for (var i=0;i<u.length;i++) if (v >= u[i][0]) return (v/u[i][0]).toLocaleString("es-ES",{maximumFractionDigits:1}) + " " + u[i][1] + " " + (ccy||"");
    return v.toLocaleString("es-ES") + " " + (ccy||"");
  }

  document.getElementById("search").addEventListener("submit", function(e){
    e.preventDefault();
    var t = document.getElementById("q").value.trim().toUpperCase();
    if (t) location.href = BASE + encodeURIComponent(t);
  });

  var LIMIT = 100;
  fetch(BASE + "index.json", {cache: "no-cache"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(idx){
      var dl = document.getElementById("tickers");
      idx.companies.forEach(function(c){
        var o = document.createElement("option"); o.value = c[0]; o.label = c[1]; dl.appendChild(o);
      });
      document.getElementById("foot").textContent =
        "Datos de Yahoo Finance, actualizados " + idx.updated + ". " +
        "Herramienta educativa: no es una recomendación de inversión.";
      if (!wanted) return renderHome(idx);
      return fetch(BASE + "c/" + encodeURIComponent(wanted) + ".json", {cache: "no-cache"})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(c){ renderCompany(idx, wanted, c); });
    })
    .catch(function(){
      app.innerHTML = '<div class="card msg">Todavía no hay datos. Lanza el workflow en GitHub Actions y vuelve en unos minutos.</div>';
    });

  function renderHome(idx){
    document.title = "Ranking · Evaluación de empresas";
    var all = idx.companies.map(function(c){
      return {ticker:c[0], name:c[1], score:c[2], q:c[3], f:c[4], v:c[5], sector:c[6] || "", p:c[7], pe:c[8], eg:c[9], roic:c[10], wacc:c[11]};
    });
    var sectors = Array.from(new Set(all.map(function(c){ return c.sector; }).filter(Boolean))).sort();
    var high = all.filter(function(c){ return c.score >= 60; }).length;
    app.innerHTML =
      '<div class="card"><h1>Ranking</h1><p class="sub">' + all.length.toLocaleString("es-ES") + ' empresas puntuadas de 0 a 100 (' +
      high + ' con 60 o más): calidad (15 puntos de Phil Fisher, 30), salud financiera (ROIC y crecimiento del EPS, 30), ' +
      'valuación (PEG, P/E, P/FCF, FCF yield, 30) y previsiones de analistas (10).</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">' +
      '<input id="flt" placeholder="Filtrar por nombre o ticker" style="text-transform:none;flex:1;min-width:180px">' +
      '<select id="sec" style="font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)">' +
      '<option value="">Todos los sectores</option>' + sectors.map(function(s){ return '<option>' + esc(s) + '</option>'; }).join("") +
      '</select></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)">' +
      '<span>Tachar si el P/E es más de</span>' +
      '<input id="pex" type="number" min="0" step="0.1" placeholder="X" style="width:80px;text-transform:none">' +
      '<span>veces el crecimiento del EPS (media 3 años, en %)</span>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)">' +
      '<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="wx" style="width:auto;padding:0;margin:0"> Tachar si el ROIC no supera el WACC</label>' +
      '<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="hidex" style="width:auto;padding:0;margin:0"> Ocultar tachadas</label>' +
      '</div><p class="sub" id="pexinfo" style="margin:6px 0 0"></p></div>' +
      '<div class="card"><table><thead><tr><th class="r">#</th><th>Empresa</th>' +
      '<th class="r hide-sm">Calidad</th><th class="r hide-sm">Finanzas</th><th class="r hide-sm">Valuación</th><th class="r hide-sm">Previsiones</th><th class="r">Score</th></tr></thead>' +
      '<tbody id="rows"></tbody></table><p id="more" style="text-align:center;margin:14px 0 0"></p></div>';

    var limit = LIMIT;
    // P/E muy por encima del crecimiento: P/E > X · crecimiento EPS (en %).
    // Con crecimiento nulo o negativo y P/E positivo también se tacha.
    function struckPe(c, x){
      if (!(x > 0) || c.pe == null || c.pe <= 0 || c.eg == null) return false;
      return c.eg <= 0 || c.pe > x * c.eg;
    }
    function struckWacc(c, on){
      return on && c.roic != null && c.wacc != null && c.roic <= c.wacc;
    }
    try { var saved = localStorage.getItem("pex"); if (saved) document.getElementById("pex").value = saved;
          document.getElementById("hidex").checked = localStorage.getItem("hidex") === "1";
          document.getElementById("wx").checked = localStorage.getItem("wx") === "1"; } catch(e) {}
    function draw(){
      var x = parseFloat(String(document.getElementById("pex").value).replace(",", "."));
      var hidex = document.getElementById("hidex").checked;
      var wx = document.getElementById("wx").checked;
      var q = document.getElementById("flt").value.trim().toLowerCase();
      var s = document.getElementById("sec").value;
      var list = all.filter(function(c){
        c.xp = struckPe(c, x); c.xw = struckWacc(c, wx); c.x = c.xp || c.xw;
        return (!s || c.sector === s) && !(hidex && c.x) && (!q || c.ticker.toLowerCase().indexOf(q) >= 0 || c.name.toLowerCase().indexOf(q) >= 0);
      });
      document.getElementById("rows").innerHTML = list.slice(0, limit).map(function(c){
        return '<tr' + (c.x ? ' class="struck" title="' + [c.xp ? 'P/E ' + fmt(c.pe) + ' vs crecimiento EPS ' + fmt(c.eg) + '%' : '', c.xw ? 'ROIC ' + fmt(c.roic) + '% vs WACC ' + fmt(c.wacc) + '%' : ''].filter(Boolean).join(' · ') + '"' : '') + '><td class="r">' + (all.indexOf(c)+1) + '</td>' +
          '<td><a href="' + BASE + encodeURIComponent(c.ticker) + '"><b>' + esc(c.ticker) + '</b></a> ' +
          '<span class="sub hide-sm">' + esc(c.name) + '</span></td>' +
          '<td class="r hide-sm">' + fmt(c.q) + '</td><td class="r hide-sm">' + fmt(c.f) + '</td><td class="r hide-sm">' + fmt(c.v) + '</td><td class="r hide-sm">' + fmt(c.p) + '</td>' +
          '<td class="r"><b style="color:' + color(c.score/100) + '">' + fmt(c.score) + '</b></td></tr>';
      }).join("") || '<tr><td colspan="7" class="msg">Sin resultados</td></tr>';
      var nx = all.filter(function(c){ return c.x; }).length;
      var why = [];
      if (x > 0) why.push("P/E > " + String(x).replace(".", ",") + " × crecimiento EPS o crecimiento negativo");
      if (wx) why.push("ROIC ≤ WACC");
      document.getElementById("pexinfo").textContent = why.length
        ? nx.toLocaleString("es-ES") + " empresas tachadas (" + why.join("; ") + ")."
        : "";
      var more = document.getElementById("more");
      more.innerHTML = list.length > limit ? '<button id="mbtn">Mostrar más (' + (list.length - limit).toLocaleString("es-ES") + ')</button>' : "";
      if (list.length > limit) document.getElementById("mbtn").onclick = function(){ limit += LIMIT; draw(); };
    }
    document.getElementById("flt").oninput = function(){ limit = LIMIT; draw(); };
    document.getElementById("pex").oninput = function(){ try { localStorage.setItem("pex", this.value); } catch(e) {} limit = LIMIT; draw(); };
    document.getElementById("wx").onchange = function(){ try { localStorage.setItem("wx", this.checked ? "1" : "0"); } catch(e) {} limit = LIMIT; draw(); };
    document.getElementById("hidex").onchange = function(){ try { localStorage.setItem("hidex", this.checked ? "1" : "0"); } catch(e) {} limit = LIMIT; draw(); };
    document.getElementById("sec").onchange = function(){ limit = LIMIT; draw(); };
    draw();
  }

  function renderCompany(data, t, c){
    if (!c){
      app.innerHTML = '<div class="card msg"><b>' + esc(t) + '</b> no está en la lista analizada.<br>' +
        'Se evalúan las cotizadas en EE. UU. de más de 1.000 M$ y una selección global. <a href="' + BASE + '">Ver todas</a>.</div>';
      return;
    }
    document.title = c.ticker + " · " + c.score + "/100";
    var W = data.weights;
    var pillars = [
      ["Calidad (Fisher)", c.pillars.quality, W.quality_fisher],
      ["Salud financiera", c.pillars.financial, W.financial_gates],
      ["Valuación", c.pillars.valuation, W.valuation]
    ].concat(W.forecast ? [["Previsiones", c.pillars.forecast, W.forecast]] : []).map(function(p){
      var pct = p[2] ? p[1]/p[2] : 0;
      return '<div class="pill-row"><span>' + p[0] + '</span><div class="bar"><i style="width:' + (pct*100).toFixed(0) +
        '%;background:' + color(pct) + '"></i></div><span class="num">' + fmt(p[1]) + ' / ' + p[2] + '</span></div>';
    }).join("");

    function metricRows(group){
      return c.metrics.filter(function(m){ return m.group === group; }).map(function(m){
        return '<tr><td>' + esc(m.label) + (m.note ? '<span style="display:block;font-size:12px;color:var(--muted)">' + esc(m.note) + '</span>' : '') + '</td><td class="r"><b>' + fmt(m.value, m.unit) + '</b></td>' +
          '<td class="r sub">' + esc(m.rule) + '</td><td class="r">' + (m.points != null ? '<span class="tag ' + cls(m.score) + '">' + fmt(m.points) + ' / 5</span>' : m.score == null ? (m.status ? '<span class="tag ' + (m.status.indexOf('>') > 0 ? 'ok' : 'no') + '">' + esc(m.status) + '</span>' : '') : '<span class="tag ' + cls(m.score) + '">' + label(m.score) + '</span>') + '</td></tr>';
      }).join("");
    }
    var thead = '<thead><tr><th>Ratio</th><th class="r">Valor</th><th class="r">Objetivo</th><th class="r">Estado</th></tr></thead>';

    var fisher;
    if (c.fisher_checks){
      fisher = '<ul class="checks">' + data.fisher_labels.map(function(l, i){
        var ok = c.fisher_checks[i];
        return '<li class="' + (ok ? "ok" : "no") + '" data-mark="' + (ok ? "✓" : "✗") + '"><span style="color:var(--ink)">' + esc(l) + '</span></li>';
      }).join("") + '</ul>';
    } else {
      fisher = '<p class="sub">Evaluado cualitativamente con Claude.</p>';
    }

    app.innerHTML =
      '<div class="card"><div class="hero"><div>' +
        '<h1>' + esc(c.name) + '</h1>' +
        '<div class="sub">' + esc(c.ticker) + (c.sector ? ' · ' + esc(c.sector) : '') + (c.country ? ' · ' + esc(c.country) : '') + '</div>' +
        '<div class="sub">Precio ' + fmt(c.price) + ' ' + esc(c.currency || "") + ' · Capitalización ' + bigMoney(c.market_cap, c.currency) + '</div>' +
      '</div><div class="score"><b style="color:' + color(c.score/100) + '">' + fmt(c.score) + '</b><span>de 100</span></div></div>' +
      '<div class="pillars">' + pillars + '</div></div>' +
      '<div class="card"><h2>Salud financiera</h2><table class="m">' + thead + '<tbody>' + metricRows("financial") + '</tbody></table></div>' +
      '<div class="card"><h2>Valuación</h2><table class="m">' + thead + '<tbody>' + metricRows("valuation") + '</tbody></table></div>' +
      (c.forecast ? '<div class="card"><h2>Previsiones de analistas · ' + fmt(c.pillars.forecast) + ' de 10</h2><table class="m">' +
        thead.replace(">Estado<", ">Puntos<") + '<tbody>' + metricRows("forecast") + '</tbody></table>' +
        '<p class="sub">Sin datos de analistas (o con menos de 3) cada criterio puntúa neutro: 2,5 de 5.</p></div>' : '') +
      '<div class="card"><h2>Calidad · ' + fmt(c.fisher_points) + ' de 15 puntos Fisher</h2>' + fisher + '</div>';
  }
})();
</script>
</body>
</html>
